<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8a5a32"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Quixxen</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{background:#8a5a32;background-image:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.03),rgba(255,255,255,.02));background-size:64px 100%,100% 9px}#app{position:fixed;inset:0;padding:max(74px,calc(env(safe-area-inset-top) + 48px)) 14px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column}#restart{position:absolute;right:18px;top:max(14px,env(safe-area-inset-top));z-index:10;border:0;border-radius:15px;background:#0003;color:#fff;padding:0 16px;height:50px;font-size:17px;font-weight:700}#area{flex:1;display:grid;grid-template-rows:1.08fr repeat(4,1fr);align-items:center;min-height:0}.white{display:flex;gap:54px;justify-content:center}.row{display:grid;grid-template-columns:82px 102px 82px;gap:22px;align-items:center;justify-content:center}.die,.sum{border-radius:20px;box-shadow:0 8px 14px #0008,inset 0 2px 4px #fff7}.die{width:102px;height:102px;transition:.3s}.sum{width:82px;height:82px;display:flex;align-items:center;justify-content:center;font-size:39px;font-weight:800;text-shadow:0 2px 3px #0006;transition:.22s}.face{position:relative;width:100%;height:100%;border-radius:20px}.pip{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 1px 2px #0008}.gone>*{opacity:0;pointer-events:none}#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111e;padding:13px 18px;border-radius:14px;opacity:0;z-index:20}.show{opacity:1!important}@media(max-width:390px){.white{gap:40px}.row{grid-template-columns:72px 92px 72px;gap:16px}.die{width:92px;height:92px}.sum{width:72px;height:72px;font-size:34px}.pip{width:15px;height:15px}}</style></head><body>
<div id="app"><button id="restart">Neustart</button><div id="area"><div class="white"><div class="die" id="wl"></div><div class="die" id="wr"></div></div>
<div class="row" data-c="red"><div class="sum l"></div><div class="die color"></div><div class="sum r"></div></div>
<div class="row" data-c="yellow"><div class="sum l"></div><div class="die color"></div><div class="sum r"></div></div>
<div class="row" data-c="green"><div class="sum l"></div><div class="die color"></div><div class="sum r"></div></div>
<div class="row" data-c="blue"><div class="sum l"></div><div class="die color"></div><div class="sum r"></div></div></div>
</div><div id="toast"></div>
<script>
const C={white:{h:'#f5f4ed',p:'#222'},red:{h:'#ed1c24',p:'#fff',n:'Rot'},yellow:{h:'#ffd21c',p:'#222',n:'Gelb'},green:{h:'#16aa4b',p:'#fff',n:'Grün'},blue:{h:'#176fd1',p:'#fff',n:'Blau'}},P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,25],[72,25],[28,50],[72,50],[28,75],[72,75]]};let gone=JSON.parse(localStorage.getItem('quixxenGone')||'[]'),v={wl:1,wr:1,red:1,yellow:1,green:1,blue:1},timer,suppress=false;
function face(n,c){let f=document.createElement('div');f.className='face';f.style.background=c.h;P[n].forEach(([x,y])=>{let p=document.createElement('i');p.className='pip';p.style.left=x+'%';p.style.top=y+'%';p.style.background=c.p;f.appendChild(p)});return f}
function die(el,n,c,delay=0){
 el.innerHTML='';el.appendChild(face(n,c));
 let a=-12+Math.random()*24;
 el.style.transition='none';
 el.style.opacity='0';
 el.style.transform=`translateY(-70px) rotate(${a+540}deg) scale(.82)`;
 setTimeout(()=>{
   el.style.transition='transform .62s cubic-bezier(.18,.78,.22,1.18), opacity .12s';
   el.style.opacity='1';
   el.style.transform=`translateY(0) rotate(${a}deg) scale(1)`;
 },delay);
}
function sum(el,n,c){el.textContent=n;el.style.background=c.h;el.style.color=c.p}
function render(animated=false){
 const step=animated?220:0;
 let order=0;
 die(document.querySelector('#wl'),v.wl,C.white,order++*step);
 die(document.querySelector('#wr'),v.wr,C.white,order++*step);
 document.querySelectorAll('.row').forEach(r=>{
   let id=r.dataset.c,c=C[id];r.classList.toggle('gone',gone.includes(id));
   if(!gone.includes(id)){
     let delay=order++*step;
     die(r.querySelector('.color'),v[id],c,delay);
     setTimeout(()=>{sum(r.querySelector('.l'),v[id]+v.wl,c);sum(r.querySelector('.r'),v[id]+v.wr,c)},delay+420);
   }
 });
}
function roll(){if(suppress){suppress=false;return}v.wl=1+Math.floor(Math.random()*6);v.wr=1+Math.floor(Math.random()*6);['red','yellow','green','blue'].forEach(x=>{if(!gone.includes(x))v[x]=1+Math.floor(Math.random()*6)});render(true);if(navigator.vibrate)navigator.vibrate(28)}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)}
document.querySelectorAll('.color').forEach(dieEl=>{let r=dieEl.closest('.row'),id=r.dataset.c;let start=e=>{e.preventDefault();timer=setTimeout(()=>{suppress=true;if(!gone.includes(id)){gone.push(id);localStorage.setItem('quixxenGone',JSON.stringify(gone));render(false);if(navigator.vibrate)navigator.vibrate([45,35,45]);toast(C[id].n+' herausgenommen')}},850)},stop=()=>{clearTimeout(timer)};dieEl.addEventListener('touchstart',start,{passive:false});dieEl.addEventListener('touchend',stop);dieEl.addEventListener('touchcancel',stop)});
document.querySelector('#area').onclick=roll;document.querySelector('#restart').onclick=e=>{e.stopPropagation();if(confirm('Neues Spiel starten?')){gone=[];localStorage.setItem('quixxenGone','[]');roll()}};roll();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
